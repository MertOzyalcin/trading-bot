<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlphaBot — Trading Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:         #080a0f;
      --surface:    #0e1117;
      --surface2:   #131720;
      --border:     #1c2130;
      --border2:    #242d40;
      --text:       #b8c0d4;
      --muted:      #404860;
      --heading:    #e8ecf8;
      --green:      #0fd97e;
      --green-glow: rgba(15,217,126,0.15);
      --green-dim:  #0a2b1e;
      --red:        #ff5470;
      --red-dim:    #2b0a14;
      --amber:      #ffb830;
      --amber-dim:  #2b1e00;
      --blue:       #4db8ff;
      --blue-dim:   #082030;
      --purple:     #b69fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(15,217,126,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(77,184,255,0.04) 0%, transparent 60%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,17,23,0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 14px; }

    .logo-mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--green), #00b8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #000;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--heading);
    }

    .logo-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .mode-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(15,217,126,0.2);
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.5s infinite;
      display: inline-block;
      margin-right: 5px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .last-updated { font-size: 11px; color: var(--muted); }
    .last-updated span { color: var(--amber); }

    .nav-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .nav-btn:hover { border-color: var(--green); color: var(--green); }
    .nav-btn.accent { background: var(--green-dim); border-color: rgba(15,217,126,0.3); color: var(--green); }

    .refresh-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover { border-color: var(--green); color: var(--green); }
    .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar { height: 2px; background: var(--border); }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--blue));
      transition: width 1s linear;
      box-shadow: 0 0 6px rgba(15,217,126,0.4);
    }

    main { padding: 28px 32px 48px; max-width: 1440px; margin: 0 auto; }

    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .account-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }

    .acct-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      transition: border-color 0.2s;
    }

    .acct-card:hover { border-color: var(--border2); }

    .acct-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

    .acct-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: -0.5px;
    }

    .acct-value.green { color: var(--green); }
    .acct-value.red   { color: var(--red); }

    .rsi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }

    .rsi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      transition: all 0.25s;
    }

    .rsi-card:hover { border-color: var(--border2); transform: translateY(-1px); }
    .rsi-card.buy  { border-color: rgba(15,217,126,0.25); background: linear-gradient(135deg, var(--surface), rgba(15,217,126,0.03)); }
    .rsi-card.sell { border-color: rgba(255,84,112,0.25); background: linear-gradient(135deg, var(--surface), rgba(255,84,112,0.03)); }

    .rsi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }

    .rsi-symbol { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--heading); }
    .rsi-price  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .signal-pill {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .signal-pill.buy  { background: var(--green-dim); color: var(--green); border: 1px solid rgba(15,217,126,0.2); }
    .signal-pill.sell { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,84,112,0.2); }
    .signal-pill.hold { background: var(--surface2);  color: var(--muted); border: 1px solid var(--border); }

    .rsi-bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 10px;
      position: relative;
    }

    .rsi-bar-track::before { content: ''; position: absolute; top: -3px; bottom: -3px; left: 30%; width: 1px; background: var(--muted); opacity: 0.3; }
    .rsi-bar-track::after  { content: ''; position: absolute; top: -3px; bottom: -3px; left: 70%; width: 1px; background: var(--muted); opacity: 0.3; }

    .rsi-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
    .rsi-bar-fill.buy  { background: linear-gradient(90deg, var(--green), #00d4aa); box-shadow: 0 0 6px var(--green-glow); }
    .rsi-bar-fill.sell { background: linear-gradient(90deg, var(--amber), var(--red)); }
    .rsi-bar-fill.hold { background: linear-gradient(90deg, var(--blue), var(--purple)); }

    .rsi-bottom { display: flex; justify-content: space-between; align-items: baseline; }

    .rsi-number {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
    }

    .rsi-number.buy  { color: var(--green); }
    .rsi-number.sell { color: var(--red); }
    .rsi-number.hold { color: var(--text); }

    .rsi-hint { font-size: 10px; color: var(--muted); }

    .positions-wrap { margin-bottom: 32px; }

    .empty-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.015); }

    td.sym   { font-weight: 600; color: var(--heading); font-size: 13px; }
    td.green { color: var(--green); }
    td.red   { color: var(--red); }
    td.muted { color: var(--muted); }

    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .badge.buy             { background: var(--green-dim); color: var(--green); }
    .badge.sell            { background: var(--red-dim);   color: var(--red); }
    .badge.hold            { background: var(--surface2);  color: var(--muted); }
    .badge.skipped,
    .badge.mtf_filtered,
    .badge.macd_filtered   { background: var(--amber-dim); color: var(--amber); }
    .badge.rejected_by_ai  { background: var(--red-dim);   color: var(--red); }
    .badge.approve         { background: var(--green-dim); color: var(--green); }
    .badge.reject          { background: var(--red-dim);   color: var(--red); }
    .badge.na              { background: var(--surface2);  color: var(--muted); }

    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .table-scroll { max-height: 320px; overflow-y: auto; }
    .table-scroll::-webkit-scrollbar { width: 3px; }
    .table-scroll::-webkit-scrollbar-track { background: transparent; }
    .table-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">α</div>
    <div>
      <div class="logo-text">AlphaBot</div>
      <div class="logo-sub">AI-Powered Trading System</div>
    </div>
  </div>
  <div class="header-right">
    <div class="mode-badge">
      <span class="status-dot"></span>PAPER TRADING
    </div>
    <span class="last-updated">
      Updated <span id="last-updated-time">--:--:--</span>
      &nbsp;·&nbsp; <span id="countdown">60</span>s
    </span>
    <a href="/learn"    class="nav-btn accent">📖 Learn</a>
    <a href="/backtest" class="nav-btn">🔬 Lab</a>
    <button class="refresh-btn" onclick="fetchData()" id="refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Refresh
    </button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill" style="width:100%"></div>
</div>

<main>
  <div class="section-label">Account Overview</div>
  <div class="account-row">
    <div class="acct-card"><div class="acct-label">Cash Available</div><div class="acct-value" id="acct-cash">—</div></div>
    <div class="acct-card"><div class="acct-label">Total Equity</div><div class="acct-value" id="acct-equity">—</div></div>
    <div class="acct-card"><div class="acct-label">Today's P&L</div><div class="acct-value" id="acct-pl">—</div></div>
  </div>

  <div class="section-label">Live RSI Signals</div>
  <div class="rsi-grid" id="rsi-grid"></div>

  <div class="section-label">Open Positions</div>
  <div class="positions-wrap" id="positions-wrap"></div>

  <div class="bottom-grid">
    <div>
      <div class="section-label">Trade History</div>
      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Time</th><th>Symbol</th><th>Price</th><th>RSI</th><th>Action</th><th>Qty</th></tr></thead>
            <tbody id="trade-log"><tr><td colspan="6" style="color:var(--muted);text-align:center;padding:24px">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
    <div>
      <div class="section-label">Claude AI Decisions</div>
      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Time</th><th>Symbol</th><th>RSI</th><th>Claude</th><th>Result</th></tr></thead>
            <tbody id="claude-log"><tr><td colspan="5" style="color:var(--muted);text-align:center;padding:24px">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  let countdown = 60;

  const fmt = n => '$' + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

  function renderAccount(a) {
    document.getElementById('acct-cash').textContent   = fmt(a.cash);
    document.getElementById('acct-equity').textContent = fmt(a.equity);
    const el = document.getElementById('acct-pl');
    el.textContent = (a.pl_today >= 0 ? '+' : '') + fmt(a.pl_today);
    el.className   = 'acct-value ' + (a.pl_today >= 0 ? 'green' : 'red');
  }

  function renderRSI(list) {
    document.getElementById('rsi-grid').innerHTML = list.map(s => {
      const cls = s.signal.toLowerCase();
      return `
        <div class="rsi-card ${cls}">
          <div class="rsi-top">
            <div>
              <div class="rsi-symbol">${s.symbol}</div>
              <div class="rsi-price">$${s.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
            </div>
            <div class="signal-pill ${cls}">${s.signal}</div>
          </div>
          <div class="rsi-bar-track">
            <div class="rsi-bar-fill ${cls}" style="width:${Math.min(100,s.rsi)}%"></div>
          </div>
          <div class="rsi-bottom">
            <div class="rsi-number ${cls}">${s.rsi}</div>
            <div class="rsi-hint">30 · 70</div>
          </div>
        </div>`;
    }).join('');
  }

  function renderPositions(p) {
    const wrap = document.getElementById('positions-wrap');
    if (!p.length) { wrap.innerHTML = `<div class="empty-box">No open positions</div>`; return; }
    wrap.innerHTML = `<div class="table-card"><table>
      <thead><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Current</th><th>P&L</th><th>P&L %</th><th>Stop</th><th>Target</th></tr></thead>
      <tbody>${p.map(x => {
        const c = x.pl >= 0 ? 'green' : 'red';
        return `<tr>
          <td class="sym">${x.symbol}</td><td>${x.qty}</td>
          <td>${fmt(x.entry)}</td><td>${fmt(x.price)}</td>
          <td class="${c}">${x.pl>=0?'+':''}${fmt(x.pl)}</td>
          <td class="${c}">${x.pl_pct>=0?'+':''}${x.pl_pct.toFixed(2)}%</td>
          <td class="red">${fmt(x.stop_loss)}</td>
          <td class="green">${fmt(x.take_profit)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  }

  function renderTradeLog(log) {
    const tbody = document.getElementById('trade-log');
    const rows  = log.filter(r => r.action !== 'HOLD');
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:24px">No trades yet</td></tr>`; return; }
    tbody.innerHTML = rows.map(r => `<tr>
      <td class="muted">${r.timestamp.split(' ')[1]}</td>
      <td class="sym">${r.symbol}</td>
      <td>$${parseFloat(r.price).toFixed(2)}</td>
      <td>${r.rsi}</td>
      <td><span class="badge ${r.action.toLowerCase()}">${r.action}</span></td>
      <td>${r.qty||'—'}</td>
    </tr>`).join('');
  }

  function renderClaudeLog(log) {
    const tbody = document.getElementById('claude-log');
    const rows  = log.filter(r => r.claude === 'APPROVE' || r.claude === 'REJECT');
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:24px">No AI decisions yet</td></tr>`; return; }
    tbody.innerHTML = rows.map(r => `<tr>
      <td class="muted">${r.timestamp.split(' ')[1]}</td>
      <td class="sym">${r.symbol}</td>
      <td>${r.rsi}</td>
      <td><span class="badge ${r.claude.toLowerCase()}">${r.claude}</span></td>
      <td><span class="badge ${r.action.toLowerCase()}">${r.action}</span></td>
    </tr>`).join('');
  }

  async function fetchData() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    try {
      const res  = await fetch('/api/data');
      const data = await res.json();
      renderAccount(data.account);
      renderRSI(data.rsi);
      renderPositions(data.positions);
      renderTradeLog(data.log);
      renderClaudeLog(data.log);
      document.getElementById('last-updated-time').textContent = data.updated;
      countdown = 60;
    } catch(e) { console.error(e); }
    finally { btn.classList.remove('spinning'); }
  }

  setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown + 's';
    document.getElementById('progress-fill').style.width = (countdown / 60 * 100) + '%';
    if (countdown <= 0) { countdown = 60; fetchData(); }
  }, 1000);

  fetchData();
</script>
</body>
</html>
